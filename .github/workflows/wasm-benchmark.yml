name: Benchmark

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # 1. Generic JavaScript benchmarks
  # ─────────────────────────────────────────────
  benchmark-generic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generic benchmarks
        run: node .github/scripts/run-generic-benchmarks.mjs

      - name: Upload generic results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-generic
          path: generic-results.json

  # ─────────────────────────────────────────────
  # 2. DOM benchmarks (Chromium)
  # ─────────────────────────────────────────────
  benchmark-dom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install script dependencies
        working-directory: .github/scripts
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: .github/scripts
        run: pnpm exec playwright install --with-deps chromium

      - name: Run DOM benchmarks
        run: node .github/scripts/run-dom-benchmarks.mjs

      - name: Upload DOM results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-dom
          path: dom-results.json

  # ─────────────────────────────────────────────
  # 3. WebAssembly benchmarks
  # ─────────────────────────────────────────────
  benchmark-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Install Node.js dependencies
        working-directory: ./wasm
        run: npm ci

      - name: Build WASM modules
        working-directory: ./wasm
        run: |
          mkdir -p build
          cd build
          emcmake cmake ..
          emmake make -j$(nproc)

      - name: Run WASM benchmarks
        working-directory: ./wasm
        run: ITERATIONS=200 node benchmark.mjs > benchmark-output.txt 2>&1
        env:
          ITERATIONS: 200

      - name: Parse WASM benchmark output
        run: node .github/scripts/parse-wasm-output.mjs wasm/benchmark-output.txt wasm-results.json

      - name: Upload WASM results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-wasm
          path: |
            wasm-results.json
            wasm/benchmark-output.txt

  # ─────────────────────────────────────────────
  # 4. Generate unified GitHub Pages report
  # ─────────────────────────────────────────────
  generate-pages:
    needs: [benchmark-generic, benchmark-dom, benchmark-wasm]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install pages dependencies
        working-directory: .github/scripts/pages
        run: pnpm install --frozen-lockfile

      - name: Build pages
        working-directory: .github/scripts/pages
        run: pnpm build

      - name: Download generic results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-generic
          path: .
        continue-on-error: true

      - name: Download DOM results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-dom
          path: .
        continue-on-error: true

      - name: Download WASM results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-wasm
          path: .
        continue-on-error: true

      - name: Generate GitHub Pages content
        run: node .github/scripts/generate-pages.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ─────────────────────────────────────────────
  # 5. Deploy to GitHub Pages
  # ─────────────────────────────────────────────
  deploy:
    needs: generate-pages
    runs-on: ubuntu-latest
    if: >
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.generate-pages.result == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
