<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Benchmark Results</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"
          crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-color: #1a1a2e;
      --card-bg: #16213e;
      --text-color: #eaeaea;
      --accent-color: #0f3460;
      --highlight: #e94560;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    h1 { color: var(--highlight); border-bottom: 2px solid var(--highlight); padding-bottom: 10px; }
    h2 { color: var(--text-color); margin-top: 30px; }
    h3 { color: #4ecdc4; margin-top: 20px; }

    .info, .system-info, .benchmark-section {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .info p { margin: 5px 0; }

    .system-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    .system-info-item { padding: 8px; }

    .benchmark-section { padding: 20px; }

    .chart-container { width: 100%; height: 420px; margin: 20px 0; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }

    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--accent-color); }

    th { background: var(--accent-color); color: white; position: sticky; top: 0; }

    tr:hover { background: rgba(233, 69, 96, 0.1); }

    .table-container { max-height: 500px; overflow-y: auto; border-radius: 8px; }

    .best-result { font-weight: bold; color: #4ecdc4; }

    .error-badge {
      display: inline-block;
      background: #e94560;
      color: white;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.85em;
      margin-left: 8px;
    }

    .metric-selector { margin: 16px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .metric-btn {
      padding: 8px 16px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .metric-btn:hover, .metric-btn.active { background: var(--highlight); }

    select.metric-btn { min-width: 220px; }

    .category-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }

    .tab-btn {
      padding: 10px 20px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.2s;
    }

    .tab-btn:hover, .tab-btn.active { background: var(--highlight); }

    .category-section { display: none; }
    .category-section.active { display: block; }
  </style>
</head>
<body>
<div class="container">
  <h1>🚀 JS Benchmark Results</h1>

  <div class="info">
    <p id="timestamp"></p>
    <p id="commit"></p>
  </div>

  <h2>💻 System Information</h2>
  <div class="system-info" id="systemInfo"><em>No system information available.</em></div>

  <h2>📊 Results</h2>
  <div class="category-tabs" id="categoryTabs"></div>

  <div id="categoryContent"></div>
</div>

<script>
  // ---------------------------------------------------------------------------
  // Colour palette for series
  // ---------------------------------------------------------------------------
  const PALETTE = [
    '#4ecdc4','#45b7d1','#f7dc6f','#bb8fce','#ff6b6b',
    '#52be80','#f0b27a','#7fb3d3','#f1948a','#82e0aa',
  ];

  function seriesColor(i) { return PALETTE[i % PALETTE.length]; }

  // ---------------------------------------------------------------------------
  // ECharts helpers
  // ---------------------------------------------------------------------------
  function makeChart(domId) {
    return echarts.init(document.getElementById(domId), 'dark');
  }

  // Render a bar chart for a "simple" benchmark group (generic / dom).
  // xAxis = group labels, series = one per method name.
  function renderSimpleChart(chart, groups, metric) {
    const xLabels = groups.map(g => g.label);
    const methodSet = new Set();
    groups.forEach(g => g.measurements.forEach(m => methodSet.add(m.name)));
    const methods = [...methodSet];

    const series = methods.map((method, idx) => ({
      name: method,
      type: 'bar',
      data: groups.map(g => {
        const m = g.measurements.find(m => m.name === method);
        return m ? +(m[metric] ?? m.duration ?? 0).toFixed(4) : null;
      }),
      itemStyle: { color: seriesColor(idx) },
    }));

    chart.setOption({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      legend: { data: methods, textStyle: { color: '#eaeaea' }, top: 10 },
      grid: { left: '3%', right: '4%', bottom: '20%', top: '15%', containLabel: true },
      xAxis: {
        type: 'category',
        data: xLabels,
        axisLabel: { rotate: 30, color: '#eaeaea', interval: 0, fontSize: 10 },
      },
      yAxis: {
        type: 'value',
        name: 'Duration (ms)',
        axisLabel: { color: '#eaeaea' },
        nameTextStyle: { color: '#eaeaea' },
      },
      series,
      dataZoom: [{ type: 'slider', show: xLabels.length > 8, xAxisIndex: [0], start: 0, end: 100 }],
    });
  }

  // Render a bar chart for a WASM benchmark section.
  // xAxis = test names, series = one per method.
  function renderWasmChart(chart, tests, metric) {
    const testSet   = new Set(tests.map(t => t.test));
    const methodSet = new Set(tests.map(t => t.method));
    const testNames = [...testSet];
    const methods   = [...methodSet];

    const byMethod = {};
    tests.forEach(t => {
      if (!byMethod[t.method]) byMethod[t.method] = {};
      byMethod[t.method][t.test] = t[metric];
    });

    const series = methods.map((method, idx) => ({
      name: method,
      type: 'bar',
      data: testNames.map(t => byMethod[method][t] != null ? +byMethod[method][t].toFixed(4) : null),
      itemStyle: { color: seriesColor(idx) },
    }));

    chart.setOption({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      legend: { data: methods, textStyle: { color: '#eaeaea' }, top: 10 },
      grid: { left: '3%', right: '4%', bottom: '20%', top: '15%', containLabel: true },
      xAxis: {
        type: 'category',
        data: testNames,
        axisLabel: { rotate: 30, color: '#eaeaea', interval: 0, fontSize: 10 },
      },
      yAxis: {
        type: 'value',
        name: `${metric.toUpperCase()} (ms)`,
        axisLabel: { color: '#eaeaea' },
        nameTextStyle: { color: '#eaeaea' },
      },
      series,
      dataZoom: [{ type: 'slider', show: testNames.length > 8, xAxisIndex: [0], start: 0, end: 100 }],
    });
  }

  // ---------------------------------------------------------------------------
  // Category renderers
  // ---------------------------------------------------------------------------

  // Renders a "simple" category (generic or dom).
  function renderSimpleCategory(categoryId, category) {
    const container = document.getElementById(`cat-${categoryId}`);
    const charts = [];

    category.benchmarks.forEach((bench, bi) => {
      const section = document.createElement('div');
      section.className = 'benchmark-section';

      const title = document.createElement('h3');
      title.textContent = bench.name;
      if (bench.error) {
        const badge = document.createElement('span');
        badge.className = 'error-badge';
        badge.textContent = 'Error';
        badge.title = bench.error;
        title.appendChild(badge);
      }
      section.appendChild(title);

      if (!bench.groups || bench.groups.length === 0) {
        const msg = document.createElement('p');
        msg.textContent = bench.error || 'No results captured.';
        section.appendChild(msg);
        container.appendChild(section);
        return;
      }

      // Collect all unique method names across all groups
      const allMethods = [...new Set(bench.groups.flatMap(g => g.measurements.map(m => m.name)))];

      // Chart
      const chartId = `chart-${categoryId}-${bi}`;
      const chartDiv = document.createElement('div');
      chartDiv.id = chartId;
      chartDiv.className = 'chart-container';
      section.appendChild(chartDiv);

      // Table
      const tableWrap = document.createElement('div');
      tableWrap.className = 'table-container';
      let html = '<table><thead><tr><th>Test</th>' +
        allMethods.map(m => `<th>${m}</th>`).join('') + '</tr></thead><tbody>';

      bench.groups.forEach(g => {
        const bestDur = Math.min(...g.measurements.map(m => m.duration ?? Infinity));
        html += `<tr><td>${g.label}</td>`;
        allMethods.forEach(method => {
          const m = g.measurements.find(x => x.name === method);
          if (m) {
            const isBest = Math.abs((m.duration ?? 0) - bestDur) < 1e-9;
            html += `<td class="${isBest ? 'best-result' : ''}">${(m.duration ?? 0).toFixed(4)}</td>`;
          } else {
            html += '<td>–</td>';
          }
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      tableWrap.innerHTML = html;
      section.appendChild(tableWrap);

      container.appendChild(section);

      // Deferred chart init (after DOM insertion)
      charts.push({ chartId, groups: bench.groups });
    });

    // Init charts after all sections are in DOM
    requestAnimationFrame(() => {
      charts.forEach(({ chartId, groups }) => {
        const c = makeChart(chartId);
        renderSimpleChart(c, groups, 'duration');
        window.addEventListener('resize', () => c.resize());
      });
    });
  }

  // Renders a "wasm" category.
  function renderWasmCategory(categoryId, category) {
    const container = document.getElementById(`cat-${categoryId}`);
    const charts = [];
    const WASM_METRICS = ['avg', 'median', 'min', 'p95'];
    let currentMetric = 'avg';

    // Group by benchmark name
    category.benchmarks.forEach((bench, bi) => {
      const section = document.createElement('div');
      section.className = 'benchmark-section';

      const title = document.createElement('h3');
      title.textContent = bench.name + (bench.benchmarkType ? ` — ${bench.benchmarkType}` : '');
      section.appendChild(title);

      if (!bench.tests || bench.tests.length === 0) {
        section.appendChild(Object.assign(document.createElement('p'), { textContent: 'No results.' }));
        container.appendChild(section);
        return;
      }

      // Metric selector
      const metricSel = document.createElement('div');
      metricSel.className = 'metric-selector';
      WASM_METRICS.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'metric-btn' + (m === 'avg' ? ' active' : '');
        btn.textContent = m.toUpperCase() + ' (ms)';
        btn.dataset.metric = m;
        metricSel.appendChild(btn);
      });
      section.appendChild(metricSel);

      // Chart
      const chartId = `chart-${categoryId}-${bi}`;
      const chartDiv = document.createElement('div');
      chartDiv.id = chartId;
      chartDiv.className = 'chart-container';
      section.appendChild(chartDiv);

      // Table (avg column only)
      const testNames  = [...new Set(bench.tests.map(t => t.test))].sort();
      const methods    = [...new Set(bench.tests.map(t => t.method))].sort();

      const tableWrap  = document.createElement('div');
      tableWrap.className = 'table-container';
      let html = '<table><thead><tr><th>Method</th>' +
        testNames.map(t => `<th>${t}</th>`).join('') + '</tr></thead><tbody>';

      methods.forEach(method => {
        const row = bench.tests.filter(t => t.method === method);
        const map = {};
        row.forEach(r => { map[r.test] = r; });
        html += `<tr><td>${method}</td>`;
        testNames.forEach(testName => {
          const t = map[testName];
          if (t) {
            const best = Math.min(...bench.tests.filter(x => x.test === testName).map(x => x.avg));
            html += `<td class="${Math.abs(t.avg - best) < 1e-9 ? 'best-result' : ''}">${t.avg.toFixed(4)}</td>`;
          } else {
            html += '<td>–</td>';
          }
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      tableWrap.innerHTML = html;
      section.appendChild(tableWrap);

      container.appendChild(section);

      charts.push({ chartId, tests: bench.tests, metricSel });
    });

    requestAnimationFrame(() => {
      const chartInstances = {};
      charts.forEach(({ chartId, tests, metricSel }) => {
        const c = makeChart(chartId);
        chartInstances[chartId] = { chart: c, tests };
        renderWasmChart(c, tests, currentMetric);
        window.addEventListener('resize', () => c.resize());

        metricSel.querySelectorAll('.metric-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            metricSel.querySelectorAll('.metric-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderWasmChart(chartInstances[chartId].chart, chartInstances[chartId].tests, btn.dataset.metric);
          });
        });
      });
    });
  }

  // ---------------------------------------------------------------------------
  // Bootstrap
  // ---------------------------------------------------------------------------
  fetch('benchmark-data.json')
    .then(r => r.json())
    .then(data => {
      // Header info
      document.getElementById('timestamp').innerHTML =
        '<strong>Run at:</strong> ' + new Date(data.timestamp).toLocaleString();
      document.getElementById('commit').innerHTML =
        '<strong>Commit:</strong> ' + (data.commit || '').substring(0, 8);

      // System info
      if (data.systemInfo) {
        const si = data.systemInfo;
        document.getElementById('systemInfo').innerHTML = `
          <div class="system-info-item"><strong>Platform:</strong> ${si.platform} (${si.arch})</div>
          <div class="system-info-item"><strong>Node.js:</strong> ${si.nodeVersion}</div>
          <div class="system-info-item"><strong>CPU:</strong> ${si.cpuCores}× ${si.cpuModel}</div>
          <div class="system-info-item"><strong>Memory:</strong> ${si.totalMemoryGB} GB total</div>
        `;
      }

      const tabsEl    = document.getElementById('categoryTabs');
      const contentEl = document.getElementById('categoryContent');

      const categoryOrder = ['generic', 'dom', 'wasm'];
      const categoryLabels = { generic: '⚙️ Generic JS', dom: '🌐 DOM', wasm: '🦀 WebAssembly' };

      let firstTab = true;
      categoryOrder.forEach(catId => {
        const cat = data.categories[catId];
        if (!cat) return;

        // Tab button
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (firstTab ? ' active' : '');
        btn.textContent = categoryLabels[catId] || catId;
        btn.dataset.cat = catId;
        tabsEl.appendChild(btn);

        // Content section
        const section = document.createElement('div');
        section.id = `cat-${catId}`;
        section.className = 'category-section' + (firstTab ? ' active' : '');
        const heading = document.createElement('h2');
        heading.textContent = cat.title;
        section.appendChild(heading);
        if (cat.timestamp) {
          const ts = document.createElement('p');
          ts.style.color = '#aaa';
          ts.textContent = 'Benchmarked at: ' + new Date(cat.timestamp).toLocaleString();
          section.appendChild(ts);
        }
        contentEl.appendChild(section);

        if (cat.type === 'wasm') {
          renderWasmCategory(catId, cat);
        } else {
          renderSimpleCategory(catId, cat);
        }

        firstTab = false;
      });

      // Tab switching
      tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          tabsEl.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          contentEl.querySelectorAll('.category-section').forEach(s => s.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(`cat-${btn.dataset.cat}`).classList.add('active');
        });
      });
    })
    .catch(err => {
      console.error('Failed to load benchmark data:', err);
      document.getElementById('categoryContent').innerHTML =
        '<p style="color:#e94560">Failed to load benchmark-data.json. Check the console for details.</p>';
    });
</script>
</body>
</html>
